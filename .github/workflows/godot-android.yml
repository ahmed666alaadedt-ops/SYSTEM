name: Build SYSTEM WORLD 3D Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "SYSTEM-WORLD-3D/**"
      - ".github/workflows/godot-android.yml"

permissions:
  contents: read

jobs:
  build:
    name: Export Godot Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "$SDKMANAGER" ]; then
            echo "Android SDK manager not found: $SDKMANAGER"
            exit 1
          fi

          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Download Godot 4.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          unzip -q "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot"

          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"

      - name: Install Godot 4.3 export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/template_unpack"

          unzip -q "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/template_unpack"

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [ -d "$RUNNER_TEMP/template_unpack/templates" ]; then
            cp -a "$RUNNER_TEMP/template_unpack/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$RUNNER_TEMP/template_unpack/." "$TEMPLATE_DIR/"
          fi

          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"

      - name: Configure Godot Android SDK
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary Android debug key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/system-debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=SYSTEM,C=US"

          keytool -list -v \
            -keystore "$RUNNER_TEMP/system-debug.keystore" \
            -storepass android \
            -alias androiddebugkey

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$RUNNER_TEMP/system-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Prepare Godot scripts for Android export
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD-3D"

          echo "Preparing temporary Godot script fixes..."

          rm -f "$PROJECT/scripts/world_data.gdworld_data.gd"

          sed -i \
            's/var offset := event.position - move_start$/var offset: Vector2 = event.position - move_start/' \
            "$PROJECT/scripts/fantasy_world.gd"

          sed -i \
            's/var offset := event.position - move_start_position$/var offset: Vector2 = event.position - move_start_position/' \
            "$PROJECT/scripts/historical_world.gd"

          sed -i \
            's/var offset := event.position - move_start_position$/var offset: Vector2 = event.position - move_start_position/' \
            "$PROJECT/scripts/main.gd"

          if [ -e "$PROJECT/scripts/world_data.gdworld_data.gd" ]; then
            echo "ERROR: Duplicate world_data file still exists."
            exit 1
          fi

          grep -Fq \
            'var offset: Vector2 = event.position - move_start' \
            "$PROJECT/scripts/fantasy_world.gd"

          grep -Fq \
            'var offset: Vector2 = event.position - move_start_position' \
            "$PROJECT/scripts/historical_world.gd"

          grep -Fq \
            'var offset: Vector2 = event.position - move_start_position' \
            "$PROJECT/scripts/main.gd"

          echo "Temporary script preparation completed successfully."

      - name: Configure Android export preset
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD-3D"

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["GITHUB_WORKSPACE"]) / "SYSTEM-WORLD-3D"
          preset = project / "export_presets.cfg"
          keystore = Path(os.environ["RUNNER_TEMP"]) / "system-debug.keystore"

          if not preset.is_file():
              raise RuntimeError("export_presets.cfg was not found.")

          if not keystore.is_file():
              raise RuntimeError("Temporary Android debug keystore was not found.")

          content = preset.read_text(encoding="utf-8")

          replacements = {
              'keystore/debug=""':
                  f'keystore/debug="{keystore}"',
              'keystore/debug_user=""':
                  'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""':
                  'keystore/debug_password="android"',
          }

          for old, new in replacements.items():
              if old not in content:
                  raise RuntimeError(
                      f"Expected empty export preset setting was not found: {old.split('=')[0]}"
                  )
              content = content.replace(old, new, 1)

          preset.write_text(content, encoding="utf-8")

          updated = preset.read_text(encoding="utf-8")

          required = [
              f'keystore/debug="{keystore}"',
              'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password="android"',
          ]

          for setting in required:
              if setting not in updated:
                  raise RuntimeError(
                      f"Android signing configuration verification failed: {setting.split('=')[0]}"
                  )

          print("Temporary Android export preset configured successfully.")
          PY

      - name: Import and validate Godot project
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"

          "$GODOT" \
            --headless \
            --editor \
            --path "$GITHUB_WORKSPACE/SYSTEM-WORLD-3D" \
            --quit

      - name: Verify Android export configuration
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD-3D"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"

          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "Java SDK: $JAVA_HOME"

          check_file() {
            if [ ! -f "$1" ]; then
              echo "ERROR: Required file not found: $1"
              exit 1
            fi
            echo "Verified: $2"
          }

          check_file \
            "$ANDROID_SDK_ROOT/platform-tools/adb" \
            "Android platform tools"

          check_file \
            "$ANDROID_SDK_ROOT/platforms/android-34/android.jar" \
            "Android 34 platform"

          check_file \
            "$ANDROID_SDK_ROOT/build-tools/34.0.0/aapt" \
            "Android build tools"

          check_file \
            "$RUNNER_TEMP/system-debug.keystore" \
            "Android debug keystore"

          check_file \
            "$TEMPLATE_DIR/android_debug.apk" \
            "Godot Android debug export template"

          keytool -list \
            -keystore "$RUNNER_TEMP/system-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > /dev/null

          echo "Debug keystore validation passed."

          python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path(os.environ["GITHUB_WORKSPACE"]) / "SYSTEM-WORLD-3D"
          preset = (project / "export_presets.cfg").read_text(encoding="utf-8")

          required = [
              'name="SYSTEM WORLD Android"',
              'package/unique_name="com.system.world3d.preview"',
              'package/signed=true',
              f'keystore/debug="{Path(os.environ["RUNNER_TEMP"]) / "system-debug.keystore"}"',
              'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password="android"',
          ]

          for setting in required:
              if setting not in preset:
                  raise RuntimeError(
                      f"Export preset verification failed: {setting.split('=')[0]}"
                  )

          print("Android export preset verification passed.")
          PY

          echo "All Android export prerequisites are available."

      - name: Export SYSTEM WORLD 3D APK
        shell: bash
        run: |
          set -o pipefail

          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD-3D"

          mkdir -p "$PROJECT/build"

          "$GODOT" \
            --headless \
            --verbose \
            --path "$PROJECT" \
            --export-debug \
            "SYSTEM WORLD Android" \
            "$PROJECT/build/SYSTEM-WORLD-3D-preview.apk" \
            2>&1 | tee "$RUNNER_TEMP/godot-android-export.log"

      - name: Upload Android preview
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-3D-preview
          path: SYSTEM-WORLD-3D/build/SYSTEM-WORLD-3D-preview.apk
          if-no-files-found: error
          retention-days: 14
