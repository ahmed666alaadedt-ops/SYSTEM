name: Validate SYSTEM WORLD Canonical Godot Runtime

on:
  push:
    branches:
      - main
      - feature/baghdad-five-plus-power-tower-20261122
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/canonical-godot-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-canonical-project:
    name: Import and headless-launch canonical Godot project
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4

      - name: Download Godot 4.3 stable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --version

      - name: Verify canonical project entry points
        shell: bash
        run: |
          test -f SYSTEM-WORLD/project.godot
          test -f SYSTEM-WORLD/MainScene.tscn
          grep -Fq 'run/main_scene="res://MainScene.tscn"' SYSTEM-WORLD/project.godot
          test -s SYSTEM-WORLD/assets/system_world_icon.svg
          grep -Fq 'config/icon="res://assets/system_world_icon.svg"' SYSTEM-WORLD/project.godot
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("SYSTEM-WORLD")
          registry_path = root / "data/geography/real_world_registry.json"
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          assert registry.get("coordinate_reference_system") == "EPSG:4326"
          assert registry.get("world_model") == "real_earth"
          assert "iraq_baghdad_region" in registry.get("regions", {})
          baghdad = registry.get("cities", {}).get("city_baghdad")
          assert baghdad, "Baghdad geographic anchor is missing"
          assert baghdad.get("region_id") == "iraq_baghdad_region"
          assert baghdad.get("city_status") == "geographic_anchor_only"
          lat, lon = float(baghdad["latitude"]), float(baghdad["longitude"])
          assert -90 <= lat <= 90 and -180 <= lon <= 180
          print("Canonical icon and provisional WGS84 Baghdad registry validated.")
          print("Geography remains seed-only; this check does not certify real map coverage.")
          PY
          echo "Canonical Godot project, icon and geography seed are present."

      - name: Import and parse canonical Godot project
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --editor --path "$PROJECT" --import \
            2>&1 | tee "$RUNNER_TEMP/canonical-godot-import.log"

      - name: Validate Android marketplace bridge protocol and request correlation
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_system_android_bridge.gd \
            2>&1 | tee "$RUNNER_TEMP/system-android-marketplace-bridge.log"

      - name: Validate Baghdad tower landmarks and lobby systems
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_towers.gd 2>&1 | tee "$RUNNER_TEMP/baghdad-tower-landmarks.log"
          godot_status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Baghdad tower validation failed" "$RUNNER_TEMP/baghdad-tower-landmarks.log"; then
            echo "Baghdad tower landmark validation reported an assertion or script error."
            exit 1
          fi
          if ! grep -Fq "Baghdad tower validation passed:" "$RUNNER_TEMP/baghdad-tower-landmarks.log"; then
            echo "Baghdad tower landmark validator did not reach its success sentinel (Godot exit: $godot_status)."
            exit 1
          fi
          echo "All Baghdad landmark assertions passed; accepting the known dummy-renderer teardown exit status: $godot_status."

      - name: Validate Hunter Tower recruitment invitation and guild-guide tunnel escort
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hunter_tunnel_entry.gd \
            2>&1 | tee "$RUNNER_TEMP/hunter-tower-recruitment.log"

      - name: Validate the single continuous SYSTEM Hunter Examination competition
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hunter_exam_stage_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/hunter-exam-continuous-competition.log"

      - name: Validate Baghdad tower operations, elevator staff and emergency evacuation
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_tower_elevator_safety.gd 2>&1 | tee "$RUNNER_TEMP/baghdad-tower-operations.log"
          godot_status=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Baghdad tower elevator safety validation failed" "$RUNNER_TEMP/baghdad-tower-operations.log"; then
            echo "Baghdad tower elevator safety validation reported an assertion or script error."
            exit 1
          fi
          if ! grep -Fq "Baghdad tower elevator and emergency safety validation passed:" "$RUNNER_TEMP/baghdad-tower-operations.log"; then
            echo "Baghdad tower elevator safety validator did not reach its success sentinel (Godot exit: $godot_status)."
            exit 1
          fi
          echo "All Baghdad tower elevator and emergency assertions passed; accepting the known dummy-renderer teardown exit status: $godot_status."

      - name: Validate terrain cell streaming seam and lifecycle
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_terrain_cell_streaming.gd \
            2>&1 | tee "$RUNNER_TEMP/terrain-cell-streaming.log"

      - name: Validate child-character safety rules
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_child_character_safety.gd

      - name: Validate Baghdad WGS84 anchor runtime integration
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_geography_anchor_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/geography-anchor-runtime.log"

      - name: Validate Baghdad-only Star Gate hub and Greed Island exit
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_baghdad_star_gate_hub.gd \
            2>&1 | tee "$RUNNER_TEMP/baghdad-star-gate-runtime.log"

      - name: Validate marketplace Android bridge request-response protocol
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_marketplace_bridge.gd \
            2>&1 | tee "$RUNNER_TEMP/marketplace-bridge-validation.log"

      - name: Launch canonical main scene headlessly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --quit-after 8 \
            2>&1 | tee "$RUNNER_TEMP/canonical-godot-runtime.log"

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-world-canonical-godot-validation-logs
          path: |
            ${{ runner.temp }}/canonical-godot-import.log
            ${{ runner.temp }}/canonical-godot-runtime.log
            ${{ runner.temp }}/geography-anchor-runtime.log
            ${{ runner.temp }}/baghdad-star-gate-runtime.log
            ${{ runner.temp }}/terrain-cell-streaming.log
            ${{ runner.temp }}/baghdad-tower-landmarks.log
            ${{ runner.temp }}/baghdad-tower-operations.log
            ${{ runner.temp }}/hunter-tower-recruitment.log
            ${{ runner.temp }}/hunter-exam-continuous-competition.log
          if-no-files-found: warn
          retention-days: 14
