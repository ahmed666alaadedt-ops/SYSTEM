name: Verify Baghdad OSM Source Candidate

on:
  push:
    branches:
      - main
      - feature/baghdad-five-plus-power-tower-20261122
      - 'fix/**'
    paths:
      - ".github/workflows/verify-baghdad-osm-source.yml"
      - "SYSTEM-WORLD/data/geography/real_world_registry.json"
      - "SYSTEM-WORLD/tools/geospatial/clip_osm_geojson_layers.py"
      - "SYSTEM-WORLD/tools/geospatial/build_baghdad_metric_cell_pack.py"
      - "SYSTEM-WORLD/scripts/baghdad_osm_cell_streamer.gd"
      - "SYSTEM-WORLD/scripts/world_manager.gd"
      - "SYSTEM-WORLD/scripts/modern_world_region_manager.gd"
      - "SYSTEM-WORLD/scripts/modern_continent_manager.gd"
      - "SYSTEM-WORLD/scripts/baghdad_tower_landmarks_manager.gd"
      - "SYSTEM-WORLD/data/geography/baghdad/republic_bridge_reference.json"
      - "SYSTEM-WORLD/tools/validate_baghdad_osm_runtime.gd"
      - "SYSTEM-WORLD/tools/validate_baghdad_towers.gd"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-baghdad-boundary-source:
    name: Verify BBBike Iraq PBF and Baghdad boundary relation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4

      - name: Install Osmium Tool
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          osmium --version

      - name: Download BBBike Iraq PBF and record source metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/baghdad-source"
          cd "$RUNNER_TEMP/baghdad-source"
          curl -L --fail --retry 3 --connect-timeout 30 --max-time 600 \
            "https://data.bbbike.org/osm/pbf/region/asia/iraq.osm.pbf" \
            -o iraq.osm.pbf
          test -s iraq.osm.pbf
          sha256sum iraq.osm.pbf | tee iraq.osm.pbf.sha256
          osmium fileinfo --extended --json iraq.osm.pbf > osm-fileinfo.json
          cat osm-fileinfo.json

      - name: Extract Baghdad Municipality relation and all referenced members
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          osmium getid --add-referenced --remove-tags iraq.osm.pbf r5638803 \
            --output baghdad-municipality-5638803.osm.pbf
          osmium check-refs baghdad-municipality-5638803.osm.pbf
          osmium cat baghdad-municipality-5638803.osm.pbf \
            --output baghdad-municipality-5638803.osm \
            --output-format osm

      - name: Validate relation identity and member completeness
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 - <<'PY'
          import hashlib
          import json
          from datetime import datetime, timezone
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("baghdad-municipality-5638803.osm").getroot()
          relation = next(
              (node for node in root.findall("relation") if node.attrib.get("id") == "5638803"),
              None,
          )
          if relation is None:
              raise SystemExit("OSM relation 5638803 is absent from the downloaded country extract.")

          tags = {tag.attrib["k"]: tag.attrib["v"] for tag in relation.findall("tag")}
          if tags.get("boundary") != "administrative":
              raise SystemExit(f"Unexpected boundary tag: {tags.get('boundary')!r}")
          if tags.get("admin_level") != "5":
              raise SystemExit(f"Unexpected admin_level: {tags.get('admin_level')!r}")

          members = relation.findall("member")
          if not members:
              raise SystemExit("Baghdad relation has no members.")
          counts = {}
          for member in members:
              kind = member.attrib.get("type", "unknown")
              counts[kind] = counts.get(kind, 0) + 1

          info = json.loads(Path("osm-fileinfo.json").read_text(encoding="utf-8"))
          snapshot_timestamp = (
              info.get("data", {}).get("timestamp", {}).get("last")
              or info.get("header", {}).get("option", {}).get("osmosis_replication_timestamp")
          )
          if not snapshot_timestamp:
              raise SystemExit("The PBF does not expose a verifiable OSM data timestamp.")
          parsed_timestamp = datetime.fromisoformat(snapshot_timestamp.replace("Z", "+00:00"))
          minimum_timestamp = datetime(2026, 9, 1, tzinfo=timezone.utc)
          if parsed_timestamp < minimum_timestamp:
              raise SystemExit(f"OSM extract is too old for the current production candidate: {snapshot_timestamp}")
          sha256 = hashlib.sha256(Path("iraq.osm.pbf").read_bytes()).hexdigest()
          report = {
              "source_file": "iraq.osm.pbf",
              "source_provider": "BBBike.org",
              "provider_reported_update": "2026-10-16T06:00:02Z",
              "snapshot_timestamp": snapshot_timestamp,
              "source_file_sha256": sha256,
              "source_file_size_bytes": Path("iraq.osm.pbf").stat().st_size,
              "relation_id": 5638803,
              "tags": tags,
              "member_count": len(members),
              "member_counts": counts,
              "status": "source_relation_verified_geometry_review_still_required",
              "license": "ODbL 1.0",
              "attribution": "© OpenStreetMap contributors; © BBBike.org",
          }
          Path("baghdad-source-verification.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Build Baghdad boundary geometry and clip municipal data
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          osmium export --geometry-types=polygon --attributes type,id \
            --output baghdad-boundary.geojson \
            baghdad-municipality-5638803.osm.pbf
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("baghdad-boundary.geojson").read_text(encoding="utf-8"))
          features = data.get("features", [])
          if len(features) != 1:
              raise SystemExit(f"Expected one Baghdad boundary polygon, got {len(features)}")
          feature = features[0]
          geometry = feature.get("geometry") or {}
          if geometry.get("type") not in ("Polygon", "MultiPolygon"):
              raise SystemExit(f"Unexpected boundary geometry: {geometry.get('type')!r}")

          def positions(value):
              if isinstance(value, (list, tuple)) and value and isinstance(value[0], (int, float)):
                  yield value
              elif isinstance(value, (list, tuple)):
                  for child in value:
                      yield from positions(child)

          coords = list(positions(geometry.get("coordinates", [])))
          if not coords:
              raise SystemExit("Baghdad boundary geometry has no coordinates")
          longitudes = [p[0] for p in coords]
          latitudes = [p[1] for p in coords]
          bounds = [min(longitudes), min(latitudes), max(longitudes), max(latitudes)]
          if not (43.5 <= bounds[0] < bounds[2] <= 45.2 and 32.8 <= bounds[1] < bounds[3] <= 34.0):
              raise SystemExit(f"Baghdad boundary bounds are outside the expected Iraq region: {bounds}")

          report = json.loads(Path("baghdad-source-verification.json").read_text(encoding="utf-8"))
          report["boundary_geometry_type"] = geometry["type"]
          report["boundary_feature_bounds_wgs84"] = bounds
          report["boundary_geometry_status"] = "polygon_extracted; geographic review required"
          Path("baghdad-source-verification.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Baghdad boundary bounds (WGS84):", bounds)
          PY
          osmium extract --polygon=baghdad-boundary.geojson --strategy=complete_ways --set-bounds \
            --clean=version --clean=timestamp --clean=changeset --clean=uid --clean=user \
            --output baghdad-municipality-candidate.osm.pbf iraq.osm.pbf
          osmium check-refs baghdad-municipality-candidate.osm.pbf
          osmium fileinfo --extended --json baghdad-municipality-candidate.osm.pbf \
            > baghdad-clip-fileinfo.json
          osmium tags-filter baghdad-municipality-candidate.osm.pbf nwr/building -o buildings.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf w/highway -o roads.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf w/waterway -o waterways.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf w/bridge -o bridges.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf nwr/landuse -o landuse.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf nwr/amenity -o amenities.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf w/railway -o railway.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf nwr/natural=water -o natural-water.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf nwr/natural=wetland nwr/wetland -o wetlands.osm.pbf
          osmium tags-filter baghdad-municipality-candidate.osm.pbf n/entrance n/door n/building=entrance -o entrances.osm.pbf
          for layer in buildings roads waterways bridges landuse amenities railway natural-water wetlands entrances; do
            osmium fileinfo --extended --json "$layer.osm.pbf" > "$layer-fileinfo.json"
          done
          osmium export --geometry-types=point,polygon --attributes type,id --output buildings.geojson buildings.osm.pbf
          osmium export --geometry-types=linestring --attributes type,id --output roads.geojson roads.osm.pbf
          osmium export --geometry-types=linestring --attributes type,id --output waterways.geojson waterways.osm.pbf
          osmium export --geometry-types=linestring,polygon --attributes type,id --output bridges.geojson bridges.osm.pbf
          osmium export --geometry-types=polygon --attributes type,id --output landuse.geojson landuse.osm.pbf
          osmium export --geometry-types=point,linestring,polygon --attributes type,id --output amenities.geojson amenities.osm.pbf
          osmium export --geometry-types=point,linestring --attributes type,id --output railway.geojson railway.osm.pbf
          osmium export --geometry-types=point,polygon --attributes type,id --output natural-water.geojson natural-water.osm.pbf
          osmium export --geometry-types=point,polygon --attributes type,id --output wetlands.geojson wetlands.osm.pbf
          osmium export --geometry-types=point --attributes type,id --output entrances.geojson entrances.osm.pbf
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          report = json.loads(Path("baghdad-source-verification.json").read_text(encoding="utf-8"))
          clip = Path("baghdad-municipality-candidate.osm.pbf")
          report["baghdad_clip_file_size_bytes"] = clip.stat().st_size
          report["baghdad_clip_sha256"] = hashlib.sha256(clip.read_bytes()).hexdigest()
          report["baghdad_clip_fileinfo"] = json.loads(
              Path("baghdad-clip-fileinfo.json").read_text(encoding="utf-8")
          )
          report["feature_layer_counts"] = {}
          for layer in ["buildings", "roads", "waterways", "bridges", "landuse", "amenities", "railway", "natural-water", "wetlands", "entrances"]:
              layer_info = json.loads(Path(f"{layer}-fileinfo.json").read_text(encoding="utf-8"))
              report["feature_layer_counts"][layer] = layer_info.get("data", {}).get("count", {})
          report["geojson_layer_stats"] = {}
          for layer in ["buildings", "roads", "waterways", "bridges", "landuse", "amenities", "railway", "natural-water", "entrances"]:
              geojson = json.loads(Path(f"{layer}.geojson").read_text(encoding="utf-8"))
              geometry_counts = {}
              for feature in geojson.get("features", []):
                  geometry_type = (feature.get("geometry") or {}).get("type", "null")
                  geometry_counts[geometry_type] = geometry_counts.get(geometry_type, 0) + 1
              report["geojson_layer_stats"][layer] = {
                  "feature_count": len(geojson.get("features", [])),
                  "geometry_types": geometry_counts,
              }
          report["contributor_metadata_cleaning_applied"] = [
              "version", "timestamp", "changeset", "uid", "user"
          ]
          report["baghdad_clip_status"] = "municipal_clip_created; feature counts recorded; geometry and coverage review required"
          Path("baghdad-source-verification.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("Baghdad municipal clip bytes:", report["baghdad_clip_file_size_bytes"])
          print("Baghdad municipal clip SHA-256:", report["baghdad_clip_sha256"])
          PY

      - name: Clip GeoJSON layers to Baghdad municipality polygon
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 -m pip install --disable-pip-version-check "shapely==2.1.2"
          source_timestamp="$(python3 -c 'import json; print(json.load(open("baghdad-source-verification.json"))["snapshot_timestamp"])')"
          source_sha256="$(python3 -c 'import json; print(json.load(open("baghdad-source-verification.json"))["source_file_sha256"])')"
          python3 "$GITHUB_WORKSPACE/SYSTEM-WORLD/tools/geospatial/clip_osm_geojson_layers.py" \
            --input-dir "$RUNNER_TEMP/baghdad-source" \
            --output-dir "$RUNNER_TEMP/baghdad-source/clipped_layers" \
            --boundary "$RUNNER_TEMP/baghdad-source/baghdad-boundary.geojson" \
            --source-timestamp "$source_timestamp" \
            --source-sha256 "$source_sha256"
          python3 - <<'PY'
          import json
          from pathlib import Path

          report_path = Path("baghdad-source-verification.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          clip_report = json.loads(
              Path("clipped_layers/clip-report.json").read_text(encoding="utf-8")
          )
          report["clipped_geojson_layers"] = clip_report["layers"]
          report["clipped_geojson_status"] = clip_report["status"]
          report_path.write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Verify Republic Bridge and Tigris against the current OSM snapshot
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 -m pip install --disable-pip-version-check "shapely==2.1.2"
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          from shapely.geometry import shape

          reference_path = Path(os.environ["GITHUB_WORKSPACE"]) / "SYSTEM-WORLD/data/geography/baghdad/republic_bridge_reference.json"
          reference = json.loads(reference_path.read_text(encoding="utf-8"))
          bridge_data = json.loads(Path("clipped_layers/bridges.geojson").read_text(encoding="utf-8"))
          water_data = json.loads(Path("clipped_layers/waterways.geojson").read_text(encoding="utf-8"))
          bridge_features = {int(f.get("properties", {}).get("@id", -1)): f for f in bridge_data.get("features", [])}
          water_features = {int(f.get("properties", {}).get("@id", -1)): f for f in water_data.get("features", [])}
          assert 1077808833 in bridge_features, "Republic Bridge polygon way 1077808833 missing from latest OSM extract"
          assert 4080878 in bridge_features, "Republic Bridge primary centerline way 4080878 missing from latest OSM extract"
          assert 754157537 in bridge_features, "Republic Bridge secondary centerline way 754157537 missing from latest OSM extract"
          assert 24709603 in water_features, "Tigris River way 24709603 missing from latest OSM extract"
          centroid = shape(bridge_features[1077808833]["geometry"]).centroid
          expected = reference["republic_bridge"]["center_wgs84"]
          assert abs(centroid.y - expected["latitude"]) < 0.0002
          assert abs(centroid.x - expected["longitude"]) < 0.0002
          print("Verified Republic Bridge polygon, centerline and Tigris geometry against current OSM snapshot.")
          PY

      - name: Build Baghdad core and Republic Bridge metric cell pack
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 -m pip install --disable-pip-version-check "shapely==2.1.2"
          python3 "$GITHUB_WORKSPACE/SYSTEM-WORLD/tools/geospatial/build_baghdad_metric_cell_pack.py" \
            --input-dir "$RUNNER_TEMP/baghdad-source/clipped_layers" \
            --output "$RUNNER_TEMP/baghdad-source/baghdad-metric-cell-pack-bridge-extended.zip" \
            --cell-size 200 \
            --source-timestamp "$(python3 -c 'import json; print(json.load(open("baghdad-source-verification.json"))["snapshot_timestamp"])')" \
            --cell-bounds=-2,20,-9,2
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          path = Path("baghdad-metric-cell-pack-bridge-extended.zip")
          with zipfile.ZipFile(path) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              tile_names = [name for name in archive.namelist() if name.startswith("cells/")]
              assert manifest["region_id"] == "iraq_baghdad_region"
              assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
              assert manifest["cell_size_m"] == 200.0
              assert manifest["cell_bounds_inclusive"] == [-2, 20, -9, 2]
              assert len(tile_names) == manifest["cell_count"]
              assert 1 <= len(tile_names) <= 276
              for name in tile_names:
                  tile = json.loads(archive.read(name))
                  assert tile["region_id"] == manifest["region_id"]
                  assert tile["cell_size_m"] == 200.0
                  assert isinstance(tile.get("layers"), dict)
                  for entrance in tile.get("layers", {}).get("entrances", []):
                      assert entrance.get("geometry", {}).get("type") == "Point"
                      tags = entrance.get("tags", {})
                      assert tags.get("entrance") or tags.get("door") or tags.get("building") == "entrance"
              entrance_count = sum(
                  len(json.loads(archive.read(name)).get("layers", {}).get("entrances", []))
                  for name in tile_names
              )
              print("Mapped entrance points in sample pack:", entrance_count)
              bridge_cell = json.loads(archive.read("cells/17_-6.json"))
              bridge_ids = {int(feature.get("id", "-1")) for feature in bridge_cell.get("layers", {}).get("bridges", [])}
              river_ids = {int(feature.get("id", "-1")) for feature in bridge_cell.get("layers", {}).get("waterways", [])}
              assert 1077808833 in bridge_ids, f"Republic Bridge polygon missing from cell 17_-6: {bridge_ids}"
              assert 4080878 in bridge_ids and 754157537 in bridge_ids, f"Republic Bridge roadway centerlines missing from cell 17_-6: {bridge_ids}"
              assert 24709603 in river_ids, f"Tigris River geometry missing from cell 17_-6: {river_ids}"
              print("Validated Baghdad core + Republic Bridge metric cell pack:", path.stat().st_size, "bytes;", len(tile_names), "occupied cells; bridge and Tigris present.")
          PY

      - name: Build citywide Baghdad road overview at 1 km streaming resolution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 "$GITHUB_WORKSPACE/SYSTEM-WORLD/tools/geospatial/build_baghdad_metric_cell_pack.py" \
            --input-dir "$RUNNER_TEMP/baghdad-source/clipped_layers" \
            --output "$RUNNER_TEMP/baghdad-source/baghdad-citywide-roads-1km.zip" \
            --cell-size 1000 \
            --layers roads \
            --bounds-geojson "$RUNNER_TEMP/baghdad-source/baghdad-boundary.geojson" \
            --source-timestamp "$(python3 -c 'import json; print(json.load(open("baghdad-source-verification.json"))["snapshot_timestamp"])')"
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          path = Path("baghdad-citywide-roads-1km.zip")
          with zipfile.ZipFile(path) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              names = [name for name in archive.namelist() if name.startswith("cells/")]
              assert manifest["region_id"] == "iraq_baghdad_region"
              assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
              assert manifest["cell_size_m"] == 1000.0
              assert manifest["layers_included"] == ["roads"]
              min_x, max_x, min_z, max_z = manifest["cell_bounds_inclusive"]
              assert (max_x - min_x + 1) >= 20, manifest["cell_bounds_inclusive"]
              assert (max_z - min_z + 1) >= 20, manifest["cell_bounds_inclusive"]
              assert len(names) == manifest["cell_count"] and len(names) >= 100
              occupied = set()
              road_parts = 0
              unique_ids = set()
              quadrants = set()
              mid_x, mid_z = (min_x + max_x) / 2, (min_z + max_z) / 2
              for name in names:
                  tile = json.loads(archive.read(name))
                  x, z = int(tile["cell_x"]), int(tile["cell_z"])
                  roads = tile.get("layers", {}).get("roads", [])
                  if roads:
                      occupied.add((x, z))
                      road_parts += len(roads)
                      unique_ids.update(str(item.get("id", "")) for item in roads)
                      quadrants.add((x >= mid_x, z >= mid_z))
              assert len(occupied) >= 100, f"Only {len(occupied)} road-occupied cells"
              assert road_parts >= 500, f"Only {road_parts} road fragments"
              assert len(unique_ids) >= 100, f"Only {len(unique_ids)} distinct OSM road ways"
              assert len(quadrants) == 4, f"Road coverage missing one or more municipal quadrants: {quadrants}"
              print("Verified citywide Baghdad road overview:", len(occupied), "occupied 1 km cells;", road_parts, "road fragments;", len(unique_ids), "unique OSM ways; four quadrants covered.")
          PY

      - name: Build citywide Baghdad urban detail overview at 1 km streaming resolution
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/baghdad-source"
          python3 "$GITHUB_WORKSPACE/SYSTEM-WORLD/tools/geospatial/build_baghdad_metric_cell_pack.py" \
            --input-dir "$RUNNER_TEMP/baghdad-source/clipped_layers" \
            --output "$RUNNER_TEMP/baghdad-source/baghdad-citywide-urban-1km.zip" \
            --cell-size 1000 \
            --layers buildings,waterways,bridges,landuse,amenities,railway,natural-water,entrances \
            --bounds-geojson "$RUNNER_TEMP/baghdad-source/baghdad-boundary.geojson" \
            --source-timestamp "$(python3 -c 'import json; print(json.load(open("baghdad-source-verification.json"))["snapshot_timestamp"])')"
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          path = Path("baghdad-citywide-urban-1km.zip")
          expected_layers = ["buildings", "waterways", "bridges", "landuse", "amenities", "railway", "natural-water", "wetlands", "entrances"]
          totals = {key: 0 for key in expected_layers}
          facility_types = {"hospital": 0, "police": 0, "mosque": 0, "shop": 0, "food": 0, "education": 0}
          with zipfile.ZipFile(path) as archive:
              manifest = json.loads(archive.read("manifest.json"))
              names = [name for name in archive.namelist() if name.startswith("cells/") and name.endswith(".json")]
              assert manifest["region_id"] == "iraq_baghdad_region"
              assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
              assert manifest["cell_size_m"] == 1000.0
              assert manifest["layers_included"] == expected_layers
              assert len(names) == manifest["cell_count"] and len(names) >= 100
              for name in names:
                  tile = json.loads(archive.read(name))
                  layers = tile.get("layers", {})
                  for layer in expected_layers:
                      totals[layer] += len(layers.get(layer, []))
                  for item in layers.get("amenities", []):
                      tags = item.get("tags", {})
                      amenity = str(tags.get("amenity", "")).lower()
                      shop = str(tags.get("shop", "")).lower()
                      if amenity == "hospital" or tags.get("healthcare"):
                          facility_types["hospital"] += 1
                      if amenity in ("police", "police_station"):
                          facility_types["police"] += 1
                      if amenity == "place_of_worship" and str(tags.get("religion", "")).lower() == "muslim":
                          facility_types["mosque"] += 1
                      if shop:
                          facility_types["shop"] += 1
                      if amenity in ("restaurant", "cafe", "fast_food", "food_court"):
                          facility_types["food"] += 1
                      if amenity in ("school", "university", "college", "kindergarten"):
                          facility_types["education"] += 1
          assert totals["buildings"] >= 1000, f"Too few mapped Baghdad building footprints: {totals['buildings']}"
          assert totals["amenities"] >= 10, f"Too few mapped public/commercial POIs: {totals['amenities']}"
          print("Verified citywide Baghdad urban overview:", len(names), "occupied 1 km cells")
          print("Urban feature totals:", json.dumps(totals, ensure_ascii=False, sort_keys=True))
          print("Classified facilities:", json.dumps(facility_types, ensure_ascii=False, sort_keys=True))
          PY

      - name: Add attribution and source notes
        shell: bash
        run: |
          cd "$RUNNER_TEMP/baghdad-source"
          cat > ATTRIBUTION.txt <<'EOF'
          © OpenStreetMap contributors
          Source: BBBike.org Iraq PBF extract from OpenStreetMap data.
          License: Open Database License (ODbL) 1.0.
          © OpenStreetMap contributors; © BBBike.org.
          https://data.bbbike.org/osm/region/asia/iraq/
          https://www.openstreetmap.org/copyright

          This artifact contains candidate Baghdad boundary geometry and a clipped OSM municipal PBF.
          It is not yet a reviewed or production-ready Baghdad game map.
          EOF

      - name: Upload verified boundary source artifact
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-Baghdad-OSM-boundary-candidate
          path: |
            ${{ runner.temp }}/baghdad-source/baghdad-boundary.geojson
            ${{ runner.temp }}/baghdad-source/baghdad-municipality-candidate.osm.pbf
            ${{ runner.temp }}/baghdad-source/baghdad-clip-fileinfo.json
            ${{ runner.temp }}/baghdad-source/baghdad-source-verification.json
            ${{ runner.temp }}/baghdad-source/clipped_layers/clip-report.json
            ${{ runner.temp }}/baghdad-source/clipped_layers/*.geojson
            ${{ runner.temp }}/baghdad-source/baghdad-metric-cell-pack-bridge-extended.zip
            ${{ runner.temp }}/baghdad-source/baghdad-citywide-roads-1km.zip
            ${{ runner.temp }}/baghdad-source/baghdad-citywide-urban-1km.zip
            ${{ runner.temp }}/baghdad-source/ATTRIBUTION.txt
            ${{ runner.temp }}/baghdad-source/iraq.osm.pbf.sha256
          if-no-files-found: error
          retention-days: 90
