name: Validate SYSTEM Firebase Marketplace Functions

on:
  pull_request:
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-validation.yml"
  push:
    branches:
      - feature/baghdad-five-plus-power-tower-20261122
    paths:
      - "functions/**"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/firebase-functions-validation.yml"

permissions:
  contents: read

jobs:
  firebase-functions:
    name: TypeScript build for Firebase Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Cloud Functions dependencies
        run: npm install --no-package-lock --no-audit --no-fund

      - name: Compile Cloud Functions
        run: npm run build
