name: Build SYSTEM Android App Shell

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/system-android-app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/system-android-app.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-app:
    name: Restore launcher, intro and native SYSTEM interface
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Normalize bundled intro video resource name
        shell: bash
        run: |
          set -euo pipefail
          RAW_DIR="app/src/main/res/raw"
          test -d "$RAW_DIR"
          if [[ ! -f "$RAW_DIR/system_intro.mp4" ]]; then
            mapfile -t videos < <(find "$RAW_DIR" -maxdepth 1 -type f -iname '*.mp4' -print)
            if [[ "${#videos[@]}" -ne 1 ]]; then
              echo "::error::Expected exactly one intro MP4 in $RAW_DIR; found ${#videos[@]}."
              printf '%s\\n' "${videos[@]}"
              exit 1
            fi
            cp -- "${videos[0]}" "$RAW_DIR/system_intro.mp4"
          fi
          test -s "$RAW_DIR/system_intro.mp4"

      - name: Verify launcher icon and intro resources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/res/mipmap-anydpi-v26/ic_system.xml
          test -f app/src/main/res/drawable/ic_system_foreground.xml
          test -s app/src/main/res/raw/system_intro.mp4
          grep -q 'SystemStartupGate' app/src/main/java/com/system/irtqaa/MainActivity.kt
          grep -q 'R.raw.system_intro' app/src/main/java/com/system/irtqaa/SystemStartup.kt

      - name: Build native SYSTEM Android application
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload native SYSTEM APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-native-android-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
