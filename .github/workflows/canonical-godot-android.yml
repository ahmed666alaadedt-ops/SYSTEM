name: Build SYSTEM WORLD Canonical Android APK

on:
  pull_request:
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/canonical-godot-android.yml"
      - ".github/workflows/verify-baghdad-osm-source.yml"
  push:
    branches:
      - main
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/canonical-godot-android.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Verify Baghdad OSM Source Candidate
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  build-canonical-android:
    if: always()
    name: Validate and export canonical SYSTEM WORLD
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download verified Baghdad OSM cell pack
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SYSTEM-WORLD-Baghdad-OSM-boundary-candidate
          path: ${{ runner.temp }}/baghdad-osm-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record Baghdad source workflow provenance
        if: github.event_name == 'workflow_run'
        shell: bash
        run: echo "BAGHDAD_SOURCE_WORKFLOW_RUN_ID=${{ github.event.workflow_run.id }}" >> "$GITHUB_ENV"

      - name: Verify Baghdad OSM audit provenance and install audited cell pack
        id: baghdad_pack
        shell: bash
        env:
          BAGHDAD_SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id || '' }}
          BAGHDAD_SOURCE_WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion || 'not_applicable' }}
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          SOURCE_PACK="$RUNNER_TEMP/baghdad-osm-artifact/baghdad-metric-cell-pack-5x5.zip"
          AUDIT_REPORT="$RUNNER_TEMP/baghdad-osm-artifact/baghdad-cell-connectivity-audit.json"
          DESTINATION="$PROJECT/data/geography/baghdad/cell_pack"
          if [ ! -s "$SOURCE_PACK" ]; then
            if [ -s "$DESTINATION/manifest.json" ]; then
              echo "::error::A Baghdad cell pack exists in the checkout but has no matching verified artifact provenance. Refusing to reuse it."
              exit 1
            fi
            python3 - "$RUNNER_TEMP/baghdad-cell-connectivity-audit.json" <<'PY'
          import json, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              "status": "not_available",
              "real_osm_source_required": True,
              "build_mode": "procedural_fallback_unaudited",
              "note": "No verified real Baghdad OSM pack was installed; this APK is procedural fallback only."
          }, indent=2) + "\n", encoding="utf-8")
          PY
            echo "BAGHDAD_BUILD_MODE=procedural_fallback_unaudited" >> "$GITHUB_ENV"
            echo "BAGHDAD_OSM_AUDIT_STATUS=${BAGHDAD_SOURCE_WORKFLOW_CONCLUSION}" >> "$GITHUB_ENV"
            echo "BAGHDAD_SOURCE_WORKFLOW_RUN_ID=${BAGHDAD_SOURCE_WORKFLOW_RUN_ID}" >> "$GITHUB_ENV"
            echo "mode=procedural_fallback_unaudited" >> "$GITHUB_OUTPUT"
            echo "::warning::No verified Baghdad OSM pack is available. APK will be explicitly classified as procedural fallback, not audited OSM."
            exit 0
          fi
          if [ ! -s "$AUDIT_REPORT" ]; then
            echo "::error::Baghdad OSM pack exists without its real connectivity audit report. Refusing to install it."
            exit 1
          fi
          python3 - "$SOURCE_PACK" "$AUDIT_REPORT" <<'PY'
          import json, sys, zipfile
          from pathlib import Path
          pack_path, report_path = map(Path, sys.argv[1:])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("status") != "passed" or report.get("real_osm_source_required") is not True:
              raise SystemExit("Real Baghdad OSM audit is not passed; refusing APK installation.")
          for key in ("missing_parts", "unexpected_parts", "duplicate_parts", "disconnected_seams", "overlapping_parts"):
              if report.get(key, 0):
                  raise SystemExit(f"Audit report has unresolved {key}: {report[key]}")
          with zipfile.ZipFile(pack_path) as archive:
              manifest = json.loads(archive.read("manifest.json"))
          if manifest.get("source_snapshot") != report.get("source_snapshot"):
              raise SystemExit("Cell-pack source snapshot does not match audited source snapshot.")
          if manifest.get("region_id") != "iraq_baghdad_region" or manifest.get("cell_size_m") != 200.0:
              raise SystemExit("Audited Baghdad pack has unexpected region or cell size.")
          print("Verified audit report and cell-pack source snapshot:", manifest["source_snapshot"])
          PY
          cp "$AUDIT_REPORT" "$RUNNER_TEMP/baghdad-cell-connectivity-audit.json"
          mkdir -p "$DESTINATION"
          unzip -q "$SOURCE_PACK" -d "$DESTINATION"
          test -s "$DESTINATION/manifest.json"
          echo "BAGHDAD_BUILD_MODE=audited_osm" >> "$GITHUB_ENV"
          echo "BAGHDAD_OSM_AUDIT_STATUS=passed" >> "$GITHUB_ENV"
          echo "BAGHDAD_SOURCE_WORKFLOW_RUN_ID=${BAGHDAD_SOURCE_WORKFLOW_RUN_ID}" >> "$GITHUB_ENV"
          echo "mode=audited_osm" >> "$GITHUB_OUTPUT"
          python3 - <<'PY'
          import json, pathlib
          root = pathlib.Path("SYSTEM-WORLD/data/geography/baghdad/cell_pack")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          cells = list((root / "cells").glob("*.json"))
          if len(cells) != manifest["cell_count"]:
              raise SystemExit("Installed Baghdad cell count differs from manifest.")
          print("Installed audited Baghdad OSM cell pack:", len(cells), "cells.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found: $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Download Godot 4.3 stable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --version

      - name: Install matching Godot Android export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/template_unpack"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/template_unpack"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$RUNNER_TEMP/template_unpack/templates" ]; then
            cp -a "$RUNNER_TEMP/template_unpack/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$RUNNER_TEMP/template_unpack/." "$TEMPLATE_DIR/"
          fi
          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/system-world-debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=SYSTEM WORLD,C=US"
          echo "GODOT_DEBUG_KEYSTORE=$RUNNER_TEMP/system-world-debug.keystore" >> "$GITHUB_ENV"

      - name: Configure temporary Android export signing
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          preset = Path(os.environ["GITHUB_WORKSPACE"]) / "SYSTEM-WORLD/export_presets.cfg"
          key = Path(os.environ["GODOT_DEBUG_KEYSTORE"])
          if not preset.is_file() or not key.is_file():
              raise SystemExit("Canonical Android export preset or temporary debug key is missing.")
          text = preset.read_text(encoding="utf-8")
          values = {
              'keystore/debug=""': f'keystore/debug="{key}"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in values.items():
              if old not in text:
                  raise SystemExit(f"Expected export setting not found: {old.split('=')[0]}")
              text = text.replace(old, new, 1)
          preset.write_text(text, encoding="utf-8")
          print("Temporary debug signing configured in runner workspace only.")
          PY

      - name: Verify canonical project and required character assets
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          test -s "$PROJECT/project.godot"
          test -s "$PROJECT/assets/system_world_icon.svg"
          grep -Fq 'config/icon="res://assets/system_world_icon.svg"' "$PROJECT/project.godot"
          test -s "$PROJECT/MainScene.tscn"
          test -s "$PROJECT/scripts/main.gd"
          test -s "$PROJECT/scripts/npc_character_model.gd"
          for model in \
            SYSTEM_Humanoid_Male.glb \
            SYSTEM_Humanoid_Female.glb \
            SYSTEM_Humanoid_Elder_Male.glb \
            SYSTEM_Humanoid_Elder_Female.glb \
            SYSTEM_Humanoid_Child_Male.glb \
            SYSTEM_Humanoid_Child_Female.glb; do
            test -s "$PROJECT/assets/characters/$model" || {
              echo "::error::Required GLB character asset is missing: $model"
              exit 1
            }
          done
          grep -Fq 'run/main_scene="res://MainScene.tscn"' "$PROJECT/project.godot"
          grep -Fq 'name="SYSTEM WORLD Android"' "$PROJECT/export_presets.cfg"

      - name: Import and parse canonical Godot project
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --editor --path "$PROJECT" --quit \
            2>&1 | tee "$RUNNER_TEMP/system-world-import.log"

      - name: Validate Baghdad OSM cell runtime geometry
        if: success() && hashFiles('SYSTEM-WORLD/data/geography/baghdad/cell_pack/manifest.json') != ''
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          timeout 90s "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_baghdad_osm_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/baghdad-osm-runtime.log"

      - name: Validate child character safety rules
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_child_character_safety.gd

      - name: Launch canonical main scene headlessly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --quit-after 8 \
            2>&1 | tee "$RUNNER_TEMP/system-world-runtime.log"

      - name: Verify Miyar and Adam GLB runtime companions
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_companion_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/system-companion-runtime.log"

      - name: Verify civilian NPC society and visible 3D population
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_npc_society_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/system-npc-society-runtime.log"

      - name: Report Baghdad APK data classification
        shell: bash
        run: |
          set -euo pipefail
          MODE="${BAGHDAD_BUILD_MODE:-procedural_fallback_unaudited}"
          echo "Baghdad build mode: $MODE"
          echo "Baghdad OSM audit status: ${BAGHDAD_OSM_AUDIT_STATUS:-not_available}"
          if [ "$MODE" = "audited_osm" ]; then
            echo "This APK includes the exact Baghdad OSM pack whose real geometry audit passed."
          else
            echo "This APK is an unaudited procedural fallback and must not be described as audited Baghdad OSM."
          fi

      - name: Export canonical SYSTEM WORLD Android APK
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          mkdir -p "$RUNNER_TEMP/system-world-export"
          if [ "${BAGHDAD_BUILD_MODE:-procedural_fallback_unaudited}" = "audited_osm" ]; then
            APK_NAME="SYSTEM-WORLD-Baghdad-OSM-AUDITED-debug.apk"
          else
            APK_NAME="SYSTEM-WORLD-Baghdad-PROCEDURAL-FALLBACK-UNAUDITED-debug.apk"
          fi
          "$GODOT" --headless --path "$PROJECT" \
            --export-debug "SYSTEM WORLD Android" \
            "$RUNNER_TEMP/system-world-export/$APK_NAME"
          test -s "$RUNNER_TEMP/system-world-export/$APK_NAME"
          ls -lh "$RUNNER_TEMP/system-world-export/$APK_NAME"
          sha256sum "$RUNNER_TEMP/system-world-export/$APK_NAME"
          python3 - "$RUNNER_TEMP/system-world-export/build-provenance.json" "$APK_NAME" <<'PY'
          import json, os, sys
          from pathlib import Path
          payload = {
              "baghdad_build_mode": os.environ.get("BAGHDAD_BUILD_MODE", "procedural_fallback_unaudited"),
              "baghdad_osm_audit_status": os.environ.get("BAGHDAD_OSM_AUDIT_STATUS", "not_available"),
              "source_workflow_run_id": os.environ.get("BAGHDAD_SOURCE_WORKFLOW_RUN_ID", ""),
              "github_sha": os.environ.get("GITHUB_SHA", ""),
              "github_ref": os.environ.get("GITHUB_REF", ""),
              "apk_file": sys.argv[2],
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Upload canonical Godot APK with Baghdad provenance
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BAGHDAD_BUILD_MODE == 'audited_osm' && 'SYSTEM-WORLD-Baghdad-OSM-AUDITED-android-apk' || 'SYSTEM-WORLD-Baghdad-PROCEDURAL-FALLBACK-UNAUDITED-android-apk' }}
          path: |
            ${{ runner.temp }}/system-world-export/*.apk
            ${{ runner.temp }}/system-world-export/build-provenance.json
            ${{ runner.temp }}/baghdad-cell-connectivity-audit.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-godot-validation-logs
          path: |
            ${{ runner.temp }}/system-world-import.log
            ${{ runner.temp }}/system-world-runtime.log
            ${{ runner.temp }}/system-companion-runtime.log
            ${{ runner.temp }}/system-npc-society-runtime.log
            ${{ runner.temp }}/baghdad-osm-runtime.log
          if-no-files-found: warn
          retention-days: 14
