name: Build SYSTEM WORLD Canonical Android APK

on:
  pull_request:
    paths:
      - "SYSTEM-WORLD/**"
      - "SYSTEM-WORLD/tools/**"
      - ".github/workflows/canonical-godot-android.yml"
  push:
    branches:
      - main
      - feature/baghdad-five-plus-power-tower-20261122
      - 'fix/**'
    paths:
      - "SYSTEM-WORLD/**"
      - "SYSTEM-WORLD/tools/**"
      - ".github/workflows/canonical-godot-android.yml"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Verify Baghdad OSM Source Candidate
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  build-canonical-android:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    name: Validate and export canonical SYSTEM WORLD
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Download verified Baghdad OSM cell pack
        if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success'
        uses: actions/download-artifact@v4
        with:
          name: SYSTEM-WORLD-Baghdad-OSM-boundary-candidate
          path: ${{ runner.temp }}/baghdad-osm-artifact
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find latest successful Baghdad OSM pack for regular builds
        if: github.event_name != 'workflow_run'
        id: latest_baghdad_source
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SOURCE_BRANCH="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          if [ -z "$SOURCE_BRANCH" ]; then SOURCE_BRANCH="main"; fi
          echo "Looking for Baghdad OSM source artifact on branch: $SOURCE_BRANCH"
          RUN_ID="$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/verify-baghdad-osm-source.yml/runs" -f "branch=$SOURCE_BRANCH" -F per_page=20 --jq '.workflow_runs | map(select(.conclusion == "success")) | .[0].id // empty')"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          if [ -n "$RUN_ID" ]; then
            echo "Using latest successful Baghdad OSM source run: $RUN_ID"
          else
            echo "::warning::No successful Baghdad OSM source run found; this build will use procedural fallback."
          fi

      - name: Download latest Baghdad OSM cell pack for regular builds
        if: github.event_name != 'workflow_run' && steps.latest_baghdad_source.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: SYSTEM-WORLD-Baghdad-OSM-boundary-candidate
          path: ${{ runner.temp }}/baghdad-osm-artifact
          run-id: ${{ steps.latest_baghdad_source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Baghdad OSM metric cells into canonical project when available
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          SOURCE_PACK="$RUNNER_TEMP/baghdad-osm-artifact/baghdad-metric-cell-pack-bridge-extended.zip"
          DESTINATION="$PROJECT/data/geography/baghdad/cell_pack"
          echo "Installing branch-matched Baghdad OSM metric cells, including Republic Bridge and Tigris."
          if [ ! -s "$SOURCE_PACK" ]; then
            echo "::warning::Baghdad OSM pack is unavailable; keeping procedural fallback for this build."
            exit 0
          fi
          mkdir -p "$DESTINATION"
          unzip -q "$SOURCE_PACK" -d "$DESTINATION"
          test -s "$DESTINATION/manifest.json"
          test -s "$DESTINATION/cells/0_0.json"
          python3 - <<'PY'
          import json
          import pathlib

          root = pathlib.Path("SYSTEM-WORLD/data/geography/baghdad/cell_pack")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          assert manifest["region_id"] == "iraq_baghdad_region"
          assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
          assert manifest["cell_size_m"] == 200.0
          assert manifest["cell_bounds_inclusive"] == [-2, 20, -9, 2]
          cells = list((root / "cells").glob("*.json"))
          assert 1 <= len(cells) <= 276 and len(cells) == manifest["cell_count"]
          bridge_cell = json.loads((root / "cells/17_-6.json").read_text(encoding="utf-8"))
          bridge_ids = {int(feature.get("id", "-1")) for feature in bridge_cell.get("layers", {}).get("bridges", [])}
          river_ids = {int(feature.get("id", "-1")) for feature in bridge_cell.get("layers", {}).get("waterways", [])}
          assert 1077808833 in bridge_ids and 4080878 in bridge_ids and 754157537 in bridge_ids
          assert 24709603 in river_ids
          print("Installed Baghdad core + Republic Bridge OSM cell pack:", len(cells), "metric cells; bridge and Tigris verified.")
          PY

      - name: Install citywide Baghdad OSM road overview when available
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          SOURCE_PACK="$RUNNER_TEMP/baghdad-osm-artifact/baghdad-citywide-roads-1km.zip"
          DESTINATION="$PROJECT/data/geography/baghdad/regional_roads"
          if [ ! -s "$SOURCE_PACK" ]; then
            echo "::error::Citywide Baghdad road overview artifact is required for this repair build."
            exit 1
          fi
          mkdir -p "$DESTINATION"
          unzip -q "$SOURCE_PACK" -d "$DESTINATION"
          test -s "$DESTINATION/manifest.json"
          python3 - <<'PY'
          import json
          import pathlib
          root = pathlib.Path("SYSTEM-WORLD/data/geography/baghdad/regional_roads")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          cells = list((root / "cells").glob("*.json"))
          assert manifest["region_id"] == "iraq_baghdad_region"
          assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
          assert manifest["cell_size_m"] == 1000.0
          assert manifest["layers_included"] == ["roads"]
          assert len(cells) == manifest["cell_count"] and len(cells) >= 100
          print("Installed citywide Baghdad OSM road overview:", len(cells), "occupied metric cells.")
          PY

      - name: Install citywide Baghdad urban detail overview
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          SOURCE_PACK="$RUNNER_TEMP/baghdad-osm-artifact/baghdad-citywide-urban-1km.zip"
          DESTINATION="$PROJECT/data/geography/baghdad/regional_urban"
          if [ ! -s "$SOURCE_PACK" ]; then
            echo "::error::Citywide Baghdad urban detail artifact is required for this repair build."
            exit 1
          fi
          mkdir -p "$DESTINATION"
          unzip -q "$SOURCE_PACK" -d "$DESTINATION"
          test -s "$DESTINATION/manifest.json"
          test -s "$DESTINATION/cells/0_0.json"
          python3 - <<'PY'
          import json
          import pathlib
          root = pathlib.Path("SYSTEM-WORLD/data/geography/baghdad/regional_urban")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          expected = ["buildings", "waterways", "bridges", "landuse", "amenities", "railway", "natural-water", "entrances"]
          cells = list((root / "cells").glob("*.json"))
          assert manifest["region_id"] == "iraq_baghdad_region"
          assert manifest["coordinate_system"] == "SYSTEM_LOCAL_ECEF_TANGENT"
          assert manifest["cell_size_m"] == 1000.0
          assert manifest["layers_included"] == expected
          assert len(cells) == manifest["cell_count"] and len(cells) >= 100
          total_buildings = 0
          total_amenities = 0
          for path in cells:
              data = json.loads(path.read_text(encoding="utf-8"))
              total_buildings += len(data.get("layers", {}).get("buildings", []))
              total_amenities += len(data.get("layers", {}).get("amenities", []))
          assert total_buildings >= 1000
          assert total_amenities >= 10
          print("Installed Baghdad citywide urban detail:", len(cells), "cells;", total_buildings, "building footprints;", total_amenities, "POIs.")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Android SDK manager not found: $SDKMANAGER"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;34.0.0" \
            "ndk;23.2.8568313" \
            "cmake;3.10.2.4988404"

      - name: Download Godot 4.3 stable
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64" --version

      - name: Install matching Godot Android export templates
        shell: bash
        run: |
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"
          mkdir -p "$RUNNER_TEMP/template_unpack"
          unzip -q "$RUNNER_TEMP/templates.tpz" -d "$RUNNER_TEMP/template_unpack"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATE_DIR"
          if [ -d "$RUNNER_TEMP/template_unpack/templates" ]; then
            cp -a "$RUNNER_TEMP/template_unpack/templates/." "$TEMPLATE_DIR/"
          else
            cp -a "$RUNNER_TEMP/template_unpack/." "$TEMPLATE_DIR/"
          fi
          echo "4.3.stable" > "$TEMPLATE_DIR/version.txt"
          test -s "$TEMPLATE_DIR/android_debug.apk"

      - name: Configure Godot Android SDK paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create temporary Android debug signing key
        shell: bash
        run: |
          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/system-world-debug.keystore" \
            -storetype JKS \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=SYSTEM WORLD,C=US"
          echo "GODOT_DEBUG_KEYSTORE=$RUNNER_TEMP/system-world-debug.keystore" >> "$GITHUB_ENV"

      - name: Configure temporary Android export signing
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          preset = Path(os.environ["GITHUB_WORKSPACE"]) / "SYSTEM-WORLD/export_presets.cfg"
          key = Path(os.environ["GODOT_DEBUG_KEYSTORE"])
          if not preset.is_file() or not key.is_file():
              raise SystemExit("Canonical Android export preset or temporary debug key is missing.")
          text = preset.read_text(encoding="utf-8")
          values = {
              'keystore/debug=""': f'keystore/debug="{key}"',
              'keystore/debug_user=""': 'keystore/debug_user="androiddebugkey"',
              'keystore/debug_password=""': 'keystore/debug_password="android"',
          }
          for old, new in values.items():
              if old not in text:
                  raise SystemExit(f"Expected export setting not found: {old.split('=')[0]}")
              text = text.replace(old, new, 1)
          preset.write_text(text, encoding="utf-8")
          print("Temporary debug signing configured in runner workspace only.")
          PY

      - name: Verify canonical project and required character assets
        shell: bash
        run: |
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          test -s "$PROJECT/project.godot"
          test -s "$PROJECT/assets/system_world_icon.svg"
          grep -Fq 'config/icon="res://assets/system_world_icon.svg"' "$PROJECT/project.godot"
          test -s "$PROJECT/MainScene.tscn"
          test -s "$PROJECT/scripts/main.gd"
          test -s "$PROJECT/scripts/npc_character_model.gd"
          for model in \
            SYSTEM_Humanoid_Male.glb \
            SYSTEM_Humanoid_Female.glb \
            SYSTEM_Humanoid_Elder_Male.glb \
            SYSTEM_Humanoid_Elder_Female.glb \
            SYSTEM_Humanoid_Child_Male.glb \
            SYSTEM_Humanoid_Child_Female.glb; do
            test -s "$PROJECT/assets/characters/$model" || {
              echo "::error::Required GLB character asset is missing: $model"
              exit 1
            }
          done
          grep -Fq 'run/main_scene="res://MainScene.tscn"' "$PROJECT/project.godot"
          grep -Fq 'name="SYSTEM WORLD Android"' "$PROJECT/export_presets.cfg"

      - name: Import and parse canonical Godot project
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --editor --path "$PROJECT" --import \
            2>&1 | tee "$RUNNER_TEMP/system-world-import.log"

      - name: Validate Baghdad OSM cell runtime geometry
        if: success() && hashFiles('SYSTEM-WORLD/data/geography/baghdad/cell_pack/manifest.json') != ''
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          timeout 90s "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_baghdad_osm_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/baghdad-osm-runtime.log"

      - name: Validate child character safety rules
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_child_character_safety.gd

      - name: Launch canonical main scene headlessly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --quit-after 8 \
            2>&1 | tee "$RUNNER_TEMP/system-world-runtime.log"

      - name: Verify Miyar and Adam GLB runtime companions
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_companion_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/system-companion-runtime.log"

      - name: Verify civilian NPC society and visible 3D population
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_npc_society_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/system-npc-society-runtime.log"

      - name: Validate Hunter Tower invitation, guild-guide escort and continuous tunnel competition
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hunter_tunnel_entry.gd \
            2>&1 | tee "$RUNNER_TEMP/hunter-tower-recruitment.log"
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hunter_exam_stage_runtime.gd \
            2>&1 | tee "$RUNNER_TEMP/hunter-exam-continuous-competition.log"
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hunter_rival_competition.gd \
            2>&1 | tee "$RUNNER_TEMP/hunter-rival-competition-runtime.log"

      - name: Export canonical SYSTEM WORLD Android APK
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          mkdir -p "$RUNNER_TEMP/system-world-export"
          "$GODOT" --headless --path "$PROJECT" \
            --export-debug "SYSTEM WORLD Android" \
            "$RUNNER_TEMP/system-world-export/SYSTEM-WORLD-debug.apk"
          test -s "$RUNNER_TEMP/system-world-export/SYSTEM-WORLD-debug.apk"
          ls -lh "$RUNNER_TEMP/system-world-export/SYSTEM-WORLD-debug.apk"
          sha256sum "$RUNNER_TEMP/system-world-export/SYSTEM-WORLD-debug.apk"

      - name: Upload canonical Godot APK
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-canonical-android-debug-apk
          path: ${{ runner.temp }}/system-world-export/SYSTEM-WORLD-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Godot validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-godot-validation-logs
          path: |
            ${{ runner.temp }}/system-world-import.log
            ${{ runner.temp }}/system-world-runtime.log
            ${{ runner.temp }}/system-companion-runtime.log
            ${{ runner.temp }}/system-npc-society-runtime.log
            ${{ runner.temp }}/hunter-tower-recruitment.log
            ${{ runner.temp }}/hunter-exam-continuous-competition.log
            ${{ runner.temp }}/baghdad-osm-runtime.log
          if-no-files-found: warn
          retention-days: 14
