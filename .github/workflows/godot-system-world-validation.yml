name: Validate SYSTEM WORLD Godot Project

on:
  pull_request:
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/godot-system-world-validation.yml"
  push:
    branches:
      - main
      - feature/baghdad-streaming-lifecycle
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/godot-system-world-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Parse and launch SYSTEM WORLD
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"

      - name: Diagnose transport network script directly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://scripts/modern_world_transport_network_manager.gd

      - name: Import resources and parse scripts
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --verbose --editor --path "$PROJECT" --quit 2>&1 | tee "$RUNNER_TEMP/system-world-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/system-world-import.log"; then
            echo "Godot reported script or resource parse errors."
            exit 1
          fi

      - name: Validate dense city greenery and pedestrian population
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/dense-city-life-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_dense_city_life.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Dense city life validation failed" "$LOG"; then
            echo "::error::Dense city life validation failed."
            exit 1
          fi
          grep -q "Dense city life validation passed:" "$LOG"

      - name: Validate 50,000 Baghdad resident seeding and save-load scale
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/dense-city-population-scale.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_dense_city_population_scale.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|50,000 resident scale validation failed" "$LOG"; then
            echo "::error::50,000 resident population scale validation failed."
            exit 1
          fi
          grep -q "50,000 resident scale validation passed:" "$LOG"

      - name: Validate city street advertising and map campaign integration
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/city-advertising-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_city_advertising.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|City advertising validation failed" "$LOG"; then
            echo "::error::City advertising integration validation failed."
            exit 1
          fi
          grep -q "City advertising validation passed:" "$LOG"

      - name: Validate civic venues and rare antiques bazaar definitions
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/baghdad-civic-venues-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_civic_venues.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Baghdad civic venue validation failed" "$LOG"; then
            echo "::error::Baghdad civic venue validation failed."
            exit 1
          fi
          grep -q "Baghdad civic venue validation passed:" "$LOG"

      - name: Validate Baghdad landmark map registration and independent Power Tower
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/baghdad-landmark-map-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_landmark_map_integration.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Baghdad landmark map integration validation failed" "$LOG"; then
            echo "::error::Baghdad landmark map integration validation failed."
            exit 1
          fi
          grep -q "Baghdad landmark map integration passed:" "$LOG"


      - name: Diagnose null meshes before behavioral validators
        continue-on-error: true
        shell: bash
        run: |
          set +e
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/diagnose_null_meshes.gd 2>&1 | tee "$RUNNER_TEMP/early-null-mesh-diagnostic.log"
          exit 0

      - name: Validate rare antiques catalogue, auctions and local ownership ledger
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/rare-antiques-market-validation.log"
          set +e
          timeout 120s "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_rare_antiques_market.gd 2>&1 | tee "$LOG"
          GODOT_STATUS=${PIPESTATUS[0]}
          set -e
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Rare antiques market validation failed" "$LOG"; then
            echo "::error::Rare antiques market validation failed."
            exit 1
          fi
          if ! grep -q "Rare antiques market validation passed:" "$LOG"; then
            echo "::error::Rare antiques market did not reach its pass marker."
            exit 1
          fi
          if [ "$GODOT_STATUS" -ne 0 ]; then
            if grep -q 'ERROR: Parameter "m" is null.' "$LOG"; then
              echo "::warning::Market logic passed; global null-mesh diagnostics are handled by the dedicated scene scan."
            else
              echo "::error::Godot exited non-zero without the known null-mesh diagnostic."
              exit "$GODOT_STATUS"
            fi
          fi
          grep -q "service_baghdad_rare_antique_market" "$PROJECT/scripts/main.gd"
          grep -q "func create_rare_antiques_market" "$PROJECT/scripts/main.gd"
          grep -q "RareAntiquesMarketUIScript" "$PROJECT/scripts/main.gd"
          grep -q "func open_market" "$PROJECT/scripts/system_rare_antiques_market_ui.gd"
          grep -q '"underworld_exchange"' "$PROJECT/scripts/modern_city_services_manager.gd"
          grep -q 'ends_with("_underworld_exchange")' "$PROJECT/scripts/main.gd"
          grep -q "func create_city_faction_ui" "$PROJECT/scripts/main.gd"

      - name: Validate modern city faction registry and reputation
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/city-faction-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_city_faction_manager.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|City faction validation failed" "$LOG"; then
            echo "::error::City faction validation failed."
            exit 1
          fi
          grep -q "City faction validation passed:" "$LOG"

      - name: Validate terrain cell streaming, shared edges and lifecycle
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_terrain_cell_streaming.gd \
            2>&1 | tee "$RUNNER_TEMP/terrain-cell-streaming.log"

      - name: Validate Baghdad city state persistence round-trip
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/baghdad-city-state-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_city_state_store.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$LOG"; then
            echo "::error::Godot reported a script error during Baghdad city-state persistence validation."
            exit 1
          fi
          grep -q "Baghdad city state persistence round-trip passed." "$LOG"



      - name: Validate Baghdad OSM runtime and historic landmarks when the candidate pack is installed
        if: hashFiles('SYSTEM-WORLD/data/geography/baghdad/cell_pack/manifest.json') != ''
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/baghdad-osm-runtime-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_osm_runtime.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Baghdad OSM runtime validation failed" "$LOG"; then
            echo "::error::Baghdad OSM runtime validation failed."
            exit 1
          fi
          grep -q "Baghdad OSM runtime validation passed:" "$LOG"

      - name: Validate motorsport race entry, checkpoints, laps and local records
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/motorsport-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_motorsport_manager.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Motorsport validation failed" "$LOG"; then
            echo "::error::Motorsport validation failed."
            exit 1
          fi
          grep -q "Motorsport validation passed:" "$LOG"

      - name: Validate Baghdad motorsport circuit physical facilities
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/baghdad-motorsport-track-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_motorsport_track_manager.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Baghdad motorsport track validation failed" "$LOG"; then
            echo "::error::Baghdad motorsport track validation failed."
            exit 1
          fi
          grep -q "Baghdad motorsport track validation passed:" "$LOG"

      - name: Validate Baghdad football match, ball interaction and scoring
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/football-match-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_football_match_manager.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Football validation failed" "$LOG"; then
            echo "::error::Football match validation failed."
            exit 1
          fi
          grep -q "Football validation passed:" "$LOG"

      - name: Validate individualized Nen discovery, training and personal techniques
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/nen-system-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_nen_system.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|SYSTEM NEN VALIDATION FAILED" "$LOG"; then
            echo "::error::SYSTEM Nen validation failed."
            exit 1
          fi
          grep -q "SYSTEM NEN VALIDATION PASSED" "$LOG"
          grep -q "func create_nen_system" "$PROJECT/scripts/main.gd"
          grep -q "قوة النِن" "$PROJECT/scripts/system_nen_ui.gd"

      - name: Validate seven-stage Hunter Examination and permanent license
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/hunter-exam-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_hunter_exam_manager.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Hunter exam validation failed" "$LOG"; then
            echo "::error::Hunter Examination validation failed."
            exit 1
          fi
          grep -q "Hunter exam validation passed:" "$LOG"

      - name: Validate Power Tower 200-floor progression, generated exploration environments and checkpoint recovery
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/power-tower-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_power_tower_progression.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Power Tower validation failed" "$LOG"; then
            echo "::error::Power Tower progression validation failed."
            exit 1
          fi
          grep -q "Power Tower validation passed:" "$LOG"


      - name: Validate Power Tower arena crowd, spectator wagers and settlement
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/power-tower-arena-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_power_tower_arena.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Power Tower arena validation failed" "$LOG"; then
            echo "::error::Power Tower arena validation failed."
            exit 1
          fi
          grep -q "Power Tower arena validation passed:" "$LOG"

      - name: Validate Power Tower arena interface and runtime wiring
        shell: bash
        run: |
          set -euo pipefail
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          LOG="$RUNNER_TEMP/power-tower-arena-ui-validation.log"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_power_tower_arena_ui.gd 2>&1 | tee "$LOG"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Power Tower arena UI validation failed" "$LOG"; then
            echo "::error::Power Tower arena UI validation failed."
            exit 1
          fi
          grep -q "Power Tower arena UI validation passed:" "$LOG"

      - name: Verify child character civilian and combat restrictions
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_child_character_safety.gd

      - name: Scan runtime scene for missing mesh resources
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --script res://tools/diagnose_null_meshes.gd

      - name: Launch main scene headlessly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --quit-after 10 2>&1 | tee "$RUNNER_TEMP/system-world-runtime.log"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/system-world-runtime.log"; then
            echo "Godot reported runtime script errors."
            exit 1
          fi
          grep -q "Baghdad map registration audit passed:" "$RUNNER_TEMP/system-world-runtime.log"
