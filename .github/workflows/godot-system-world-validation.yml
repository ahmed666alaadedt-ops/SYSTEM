name: Validate SYSTEM WORLD Godot Project

on:
  pull_request:
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/godot-system-world-validation.yml"
  push:
    branches:
      - main
      - feature/baghdad-five-plus-power-tower-20261122
    paths:
      - "SYSTEM-WORLD/**"
      - ".github/workflows/godot-system-world-validation.yml"
  workflow_dispatch:

concurrency:
  group: system-world-godot-validation-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Parse and launch SYSTEM WORLD
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Godot 4.3
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/godot"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot.zip"
          unzip -q "$RUNNER_TEMP/godot.zip" -d "$RUNNER_TEMP/godot"
          chmod +x "$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"

      - name: Diagnose transport network script directly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://scripts/modern_world_transport_network_manager.gd

      - name: Parse tower manager, progression and operations QA scripts directly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://scripts/system_baghdad_tower_operations_manager.gd
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://scripts/system_baghdad_public_leisure_manager.gd
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://scripts/system_player_progression.gd
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://tools/validate_baghdad_tower_operations.gd
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://tools/validate_shopping_tower_showcases.gd
          "$GODOT" --headless --path "$PROJECT" --check-only --script res://tools/validate_baghdad_facade_detail.gd

      - name: Import resources and parse scripts
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --editor --path "$PROJECT" --import 2>&1 | tee "$RUNNER_TEMP/system-world-import.log"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/system-world-import.log"; then
            echo "Godot reported script or resource parse errors."
            exit 1
          fi

      - name: Validate Baghdad high-detail facade windows and regional LOD
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_facade_detail.gd > "$RUNNER_TEMP/baghdad-facade-detail.log" 2>&1
          godot_status=$?
          grep -E "Baghdad facade detail validation|SCRIPT ERROR|Parse Error|ERROR:|WARNING:" "$RUNNER_TEMP/baghdad-facade-detail.log" | tail -n 80 || true
          grep -F "Baghdad facade detail validation passed:" "$RUNNER_TEMP/baghdad-facade-detail.log"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/baghdad-facade-detail.log"; then exit 1; fi
          exit "$godot_status"

      - name: Validate Baghdad Republic Bridge deck, road furniture and Tigris water
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_bridge_detail.gd > "$RUNNER_TEMP/baghdad-bridge-detail.log" 2>&1
          godot_status=$?
          grep -E "Baghdad bridge detail validation|SCRIPT ERROR|Parse Error|ERROR:|WARNING:" "$RUNNER_TEMP/baghdad-bridge-detail.log" | tail -n 80 || true
          if grep -E "SCRIPT ERROR|Parse Error|Baghdad bridge detail validation failed" "$RUNNER_TEMP/baghdad-bridge-detail.log"; then exit 1; fi
          exit "$godot_status"

      - name: Verify child character civilian and combat restrictions
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_child_character_safety.gd > "$RUNNER_TEMP/child-character-safety.log" 2>&1
          godot_status=$?
          grep -E "SYSTEM NPC QA PASS|SYSTEM CHILD QA TRANSIENT|SCRIPT ERROR|Parse Error|ERROR:|WARNING:" "$RUNNER_TEMP/child-character-safety.log" | tail -n 80 || true
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/child-character-safety.log"; then exit 1; fi
          exit "$godot_status"

      - name: Scan runtime scene for missing mesh resources
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/diagnose_null_meshes.gd > "$RUNNER_TEMP/null-mesh-diagnostic.log" 2>&1
          godot_status=$?
          grep -E "SYSTEM MESH DIAGNOSTIC|SYSTEM POST-SWITCH|SYSTEM WORLD LOAD TEST|SYSTEM TRANSIENT" "$RUNNER_TEMP/null-mesh-diagnostic.log" | tail -n 160 || true
          renderer_error_count=$(grep -c 'ERROR: Parameter "m" is null' "$RUNNER_TEMP/null-mesh-diagnostic.log" || true)
          echo "Godot 4.3 dummy-renderer lifecycle errors (upstream #86806; fix merged as #102261): $renderer_error_count"
          if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/null-mesh-diagnostic.log"; then exit 1; fi
          exit "$godot_status"

      - name: Compare fixed Dummy RenderingServer lifecycle in Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          GODOT_DIR="$RUNNER_TEMP/godot-4.4.1"
          PROJECT_44="$RUNNER_TEMP/SYSTEM-WORLD-godot-4.4.1"
          mkdir -p "$GODOT_DIR" "$PROJECT_44"
          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" \
            -o "$RUNNER_TEMP/godot-4.4.1.zip"
          unzip -q "$RUNNER_TEMP/godot-4.4.1.zip" -d "$GODOT_DIR"
          GODOT_44="$GODOT_DIR/Godot_v4.4.1-stable_linux.x86_64"
          chmod +x "$GODOT_44"
          cp -a "$PROJECT/." "$PROJECT_44/"
          rm -rf "$PROJECT_44/.godot"
          "$GODOT_44" --headless --editor --path "$PROJECT_44" --import > "$RUNNER_TEMP/godot-4.4.1-import.log" 2>&1
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/godot-4.4.1-import.log"; then
            echo "Godot 4.4.1 import/parse failed."
            exit 1
          fi
          set +e
          timeout 240s "$GODOT_44" --headless --path "$PROJECT_44" \
            --script res://tools/diagnose_null_meshes.gd > "$RUNNER_TEMP/godot-4.4.1-mesh-diagnostic.log" 2>&1
          godot_status=$?
          set -e
          renderer_error_count=$(grep -c 'ERROR: Parameter "m" is null' "$RUNNER_TEMP/godot-4.4.1-mesh-diagnostic.log" || true)
          grep -E "SYSTEM MESH DIAGNOSTIC|SYSTEM POST-SWITCH MESH DIAGNOSTIC|SYSTEM WORLD LOAD TEST|SYSTEM MESH DIAGNOSTIC TOTALS" "$RUNNER_TEMP/godot-4.4.1-mesh-diagnostic.log" | tail -n 80 || true
          echo "Godot 4.4.1 dummy-renderer mesh_get_surface_count errors: $renderer_error_count"
          if [ "$godot_status" -ne 0 ]; then exit "$godot_status"; fi
          if [ "$renderer_error_count" -gt 0 ]; then
            echo "The upstream dummy-renderer lifecycle error is still present under Godot 4.4.1."
            exit 1
          fi
          echo "Godot 4.4.1 dummy-renderer lifecycle comparison passed with zero matching errors."

      - name: Launch main scene headlessly
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --quit-after 10 > "$RUNNER_TEMP/system-world-runtime.log" 2>&1
          godot_status=$?
          grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/system-world-runtime.log" || true
          echo "Headless renderer null-mesh shutdown warnings: $(grep -c 'ERROR: Parameter "m" is null' "$RUNNER_TEMP/system-world-runtime.log" || true)"
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script" "$RUNNER_TEMP/system-world-runtime.log"; then exit 1; fi
          exit "$godot_status"

      - name: Validate cinematic modern-world presentation
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_cinematic_presentation.gd 2>&1 | tee "$RUNNER_TEMP/cinematic-presentation.log"

      - name: Validate Baghdad tower landmarks and lobby systems
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_towers.gd > "$RUNNER_TEMP/baghdad-tower-validation.log" 2>&1
          godot_status=$?
          grep -E "Baghdad tower validation|SCRIPT ERROR|Parse Error|Baghdad tower validation failed" "$RUNNER_TEMP/baghdad-tower-validation.log" | tail -n 100 || true
          echo "Headless renderer null-mesh shutdown warnings: $(grep -c 'ERROR: Parameter "m" is null' "$RUNNER_TEMP/baghdad-tower-validation.log" || true)"
          if grep -E "SCRIPT ERROR|Parse Error|Baghdad tower validation failed" "$RUNNER_TEMP/baghdad-tower-validation.log"; then exit 1; fi
          exit "$godot_status"


      - name: Validate independent Baghdad public pools, lockers and lifeguard services
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_public_leisure.gd 2>&1 | tee "$RUNNER_TEMP/baghdad-public-leisure.log"

      - name: Validate Baghdad tower interiors, NPC commerce, advertising and Power Tower boss arena
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set +e
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_baghdad_tower_operations.gd 2>&1 | tee "$RUNNER_TEMP/baghdad-tower-operations-validation.log" | grep --line-buffered -E "QA TRACE|^QA:|SYSTEM NPC QA PASS|Baghdad tower operations validation passed|Baghdad tower operations validation failed|SCRIPT ERROR|Parse Error"
          pipeline_status=("${PIPESTATUS[@]}")
          godot_status="${pipeline_status[0]}"
          echo "---- Baghdad tower and Power Tower validation summary ----"
          if grep -E "SCRIPT ERROR|Parse Error|Baghdad tower operations validation failed" "$RUNNER_TEMP/baghdad-tower-operations-validation.log"; then
            echo "Baghdad tower operations validation reported an error."
            exit 1
          fi
          exit "$godot_status"

      - name: Validate Android marketplace bridge request-response protocol
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_marketplace_bridge.gd \
            2>&1 | tee "$RUNNER_TEMP/marketplace-bridge-validation.log"

      - name: Validate hotel booking, room service, checkout and housekeeping lifecycle
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" \
            --script res://tools/validate_hotel_booking_lifecycle.gd \
            2>&1 | tee "$RUNNER_TEMP/hotel-booking-lifecycle.log"

      - name: Validate Shopping Tower 3D product showcases and purchase routing
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_shopping_tower_showcases.gd 2>&1 | tee "$RUNNER_TEMP/shopping-tower-showcases.log"

      - name: Validate Hunter rival competition and objective recovery
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_hunter_rival_competition.gd 2>&1 | tee "$RUNNER_TEMP/hunter-rival-competition-runtime.log"

      - name: Validate Hunter Tower guide escort and continuous tunnel entry
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_hunter_tunnel_entry.gd 2>&1 | tee "$RUNNER_TEMP/hunter-tower-guide-tunnel.log"

      - name: Validate the single continuous Hunter tunnel competition
        shell: bash
        run: |
          GODOT="$RUNNER_TEMP/godot/Godot_v4.3-stable_linux.x86_64"
          PROJECT="$GITHUB_WORKSPACE/SYSTEM-WORLD"
          set -o pipefail
          "$GODOT" --headless --path "$PROJECT" --script res://tools/validate_hunter_exam_stage_runtime.gd 2>&1 | tee "$RUNNER_TEMP/hunter-exam-continuous.log"

      - name: Upload Baghdad tower operations validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SYSTEM-WORLD-baghdad-operations-validation-log
          path: ${{ runner.temp }}/baghdad-tower-operations-validation.log
          if-no-files-found: ignore
          retention-days: 7
