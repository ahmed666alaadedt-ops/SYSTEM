name: SYSTEM WORLD Cinematic Humanoid Character Generator

on:
  push:
    paths:
      - "SYSTEM-WORLD/tools/blender/generate_system_humanoids.py"
      - "SYSTEM-WORLD/tools/validate_glb.py"
      - ".github/workflows/system-world-humanoid-characters.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: system-world-humanoid-character-generation
  cancel-in-progress: true

jobs:
  generate-rigged-characters:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout SYSTEM
        uses: actions/checkout@v4
      - name: Syntax-check Blender generator
        run: python3 -m py_compile SYSTEM-WORLD/tools/blender/generate_system_humanoids.py

      - name: Install Blender 4.3.2
        uses: bradyajohnston/setup-blender@v5
        with:
          version: 4.3.2

      - name: Verify Blender
        run: blender --version
      - name: Generate adult, elder, and child rigged characters
        run: |
          mkdir -p SYSTEM-WORLD-3D/assets/characters
          blender --background --factory-startup --python-exit-code 1 --python SYSTEM-WORLD/tools/blender/generate_system_humanoids.py -- --output SYSTEM-WORLD-3D/assets/characters
      - name: Validate generated GLB files
        run: |
          python3 SYSTEM-WORLD/tools/validate_glb.py --self-test
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Male.glb
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Female.glb
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Elder_Male.glb
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Elder_Female.glb
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Child_Male.glb
          test -s SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Child_Female.glb
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Male.glb --require-skin --require-animation
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Female.glb --require-skin --require-animation
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Elder_Male.glb --require-skin --require-animation
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Elder_Female.glb --require-skin --require-animation
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Child_Male.glb --require-skin --require-animation
          python3 SYSTEM-WORLD/tools/validate_glb.py SYSTEM-WORLD-3D/assets/characters/SYSTEM_Humanoid_Child_Female.glb --require-skin --require-animation
          mkdir -p SYSTEM-WORLD/assets/characters
          cp SYSTEM-WORLD-3D/assets/characters/*.glb SYSTEM-WORLD/assets/characters/
          ls -lh SYSTEM-WORLD-3D/assets/characters SYSTEM-WORLD/assets/characters
      - name: Commit generated character assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SYSTEM-WORLD-3D/assets/characters/*.glb SYSTEM-WORLD/assets/characters/*.glb
          git diff --cached --quiet || git commit -m "Generate rigged SYSTEM WORLD humanoid character assets"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not push generated character assets after three attempts."
              exit 1
            fi
            sleep 2
          done
      - name: Upload Blender source and character files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: system-world-rigged-humanoid-characters
          path: SYSTEM-WORLD-3D/assets/characters/
          if-no-files-found: error
          retention-days: 30
