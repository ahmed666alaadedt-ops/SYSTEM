name: Validate SYSTEM Firebase Functions

on:
  push:
    branches:
      - feature/baghdad-streaming-lifecycle
    paths:
      - "functions/**"
      - ".github/workflows/validate-firebase-functions.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-functions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: functions/package.json
      - name: Install dependencies
        run: npm --prefix functions install --no-audit --no-fund
      - name: Compile TypeScript Cloud Functions
        run: npm --prefix functions run build
